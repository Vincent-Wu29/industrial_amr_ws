amcl:
  ros__parameters:
    alpha1: 0.05
    alpha2: 0.05
    alpha3: 0.05
    alpha4: 0.05
    base_frame_id: base_footprint
    global_frame_id: map
    initial_pose:
      x: 2.0
      y: 7.5
      yaw: 0.0
      z: 0.0
    laser_max_range: 10.0
    laser_min_range: 0.12
    laser_model_type: likelihood_field
    max_beams: 90
    max_particles: 1500
    min_particles: 500
    odom_frame_id: odom
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1
    robot_model_type: nav2_amcl::DifferentialMotionModel
    scan_topic: /scan
    set_initial_pose: true
    sigma_hit: 0.15
    tf_broadcast: true
    transform_tolerance: 0.3
    update_min_a: 0.1
    update_min_d: 0.1
    use_sim_time: true
    z_hit: 0.8
    z_rand: 0.2
behavior_server:
  ros__parameters:
    behavior_plugins:
    - wait
    enable_stamped_cmd_vel: true
    global_costmap_topic: global_costmap/costmap_raw
    global_footprint_topic: global_costmap/published_footprint
    global_frame: map
    local_costmap_topic: local_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    local_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.2
    use_sim_time: true
    wait:
      plugin: nav2_behaviors::Wait
bt_navigator:
  ros__parameters:
    bt_loop_duration: 10
    default_server_timeout: 1000
    error_code_names:
    - compute_path_error_code
    - follow_path_error_code
    global_frame: map
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    navigators:
    - navigate_to_pose
    odom_topic: /odom
    robot_base_frame: base_footprint
    use_sim_time: true
    wait_for_service_timeout: 1000
collision_monitor:
  ros__parameters:
    FootprintApproach:
      action_type: approach
      enabled: true
      footprint_topic: /local_costmap/published_footprint
      min_points: 2
      simulation_time_step: 0.05
      time_before_collision: 1.5
      type: polygon
      visualize: false
    NearStop:
      action_type: stop
      enabled: true
      min_points: 2
      points: '[[0.40,0.32],[0.40,-0.32],[-0.40,-0.32],[-0.40,0.32]]'
      polygon_pub_topic: /collision_monitor/stop_polygon
      type: polygon
      visualize: true
    base_frame_id: base_footprint
    base_shift_correction: true
    cmd_vel_in_topic: /cmd_vel_plan
    cmd_vel_out_topic: /cmd_vel_nav
    enable_stamped_cmd_vel: true
    observation_sources:
    - scan
    odom_frame_id: odom
    polygons:
    - NearStop
    - FootprintApproach
    scan:
      enabled: true
      topic: /scan
      type: scan
    source_timeout: 0.4
    state_topic: /collision_monitor/state
    stop_pub_timeout: 2.0
    transform_tolerance: 0.2
    use_sim_time: true
controller_server:
  ros__parameters:
    FollowPath:
      BaseObstacle.scale: 0.02
      GoalAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalDist.scale: 24.0
      ObstacleFootprint.scale: 0.1
      PathAlign.forward_point_distance: 0.1
      PathAlign.scale: 32.0
      PathDist.scale: 32.0
      RotateToGoal.lookahead_time: -1.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      acc_lim_theta: 1.0
      acc_lim_x: 0.4
      acc_lim_y: 0.0
      angular_granularity: 0.025
      critics:
      - RotateToGoal
      - Oscillation
      - ObstacleFootprint
      - BaseObstacle
      - GoalAlign
      - PathAlign
      - PathDist
      - GoalDist
      debug_trajectory_details: false
      decel_lim_theta: -1.0
      decel_lim_x: -0.4
      decel_lim_y: 0.0
      linear_granularity: 0.05
      max_speed_xy: 0.35
      max_vel_theta: 0.8
      max_vel_x: 0.35
      max_vel_y: 0.0
      min_speed_theta: 0.0
      min_speed_xy: 0.0
      min_vel_x: 0.0
      min_vel_y: 0.0
      plugin: dwb_core::DWBLocalPlanner
      short_circuit_trajectory_evaluation: true
      sim_time: 1.7
      stateful: true
      trans_stopped_velocity: 0.02
      transform_tolerance: 0.2
      vtheta_samples: 30
      vx_samples: 20
      vy_samples: 1
      xy_goal_tolerance: 0.15
    controller_frequency: 20.0
    controller_plugins:
    - FollowPath
    enable_stamped_cmd_vel: true
    failure_tolerance: 0.3
    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.15
    goal_checker_plugins:
    - general_goal_checker
    min_theta_velocity_threshold: 0.001
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    progress_checker:
      movement_time_allowance: 15.0
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.15
    progress_checker_plugins:
    - progress_checker
    use_sim_time: true
global_costmap:
  global_costmap:
    ros__parameters:
      always_send_full_costmap: true
      footprint: '[[0.20,0.15],[0.20,-0.15],[-0.20,-0.15],[-0.20,0.15]]'
      footprint_padding: 0.12
      global_frame: map
      inflation_layer:
        cost_scaling_factor: 40.0
        inflation_radius: 0.55
        plugin: nav2_costmap_2d::InflationLayer
      obstacle_layer:
        enabled: true
        observation_sources: scan
        plugin: nav2_costmap_2d::ObstacleLayer
        scan:
          clearing: true
          data_type: LaserScan
          marking: true
          max_obstacle_height: 2.0
          obstacle_max_range: 1.0
          raytrace_max_range: 6.0
          topic: /scan
      plugins:
      - static_layer
      - obstacle_layer
      - inflation_layer
      publish_frequency: 1.0
      resolution: 0.05
      robot_base_frame: base_footprint
      static_layer:
        map_subscribe_transient_local: true
        plugin: nav2_costmap_2d::StaticLayer
      track_unknown_space: true
      transform_tolerance: 0.3
      update_frequency: 2.0
      use_sim_time: true
local_costmap:
  local_costmap:
    ros__parameters:
      always_send_full_costmap: true
      footprint: '[[0.20,0.15],[0.20,-0.15],[-0.20,-0.15],[-0.20,0.15]]'
      footprint_padding: 0.12
      global_frame: odom
      height: 4
      inflation_layer:
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
        plugin: nav2_costmap_2d::InflationLayer
      obstacle_layer:
        enabled: true
        observation_sources: scan
        plugin: nav2_costmap_2d::ObstacleLayer
        scan:
          clearing: true
          data_type: LaserScan
          marking: true
          max_obstacle_height: 2.0
          obstacle_max_range: 5.0
          raytrace_max_range: 6.0
          topic: /scan
      plugins:
      - obstacle_layer
      - inflation_layer
      publish_frequency: 2.0
      resolution: 0.05
      robot_base_frame: base_footprint
      rolling_window: true
      transform_tolerance: 0.2
      update_frequency: 10.0
      use_sim_time: true
      width: 4
map_server:
  ros__parameters:
    use_sim_time: true
planner_server:
  ros__parameters:
    GridBased:
      allow_unknown: false
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.15
      use_astar: false
    expected_planner_frequency: 2.0
    planner_plugins:
    - GridBased
    use_sim_time: true
